<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Expense Tracker</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <h1 class="app-title">Expense Tracker</h1>
      <div class="header-actions">
        <button id="themeToggle" aria-pressed="false" aria-label="Toggle dark mode">🌓</button>
      </div>
    </header>

    <main id="main" class="container">
      <!-- Balance section -->
      <section class="balance-container center-column" aria-labelledby="balanceTitle">
        <p id="balanceTitle" class="balance-title">Your balance</p>
        <p class="balance-amount" id="totalBalance" aria-live="polite">$0.00</p>
      </section>

      <!-- INCOME AND EXPENSE AMOUNTS -->
      <section class="total-info center-column" aria-label="Totals">
        <div class="amount-container income-color" role="region" aria-label="Income total">
          <p class="label">Income</p>
          <p class="amount" id="incomeTotalAmount">$0.00</p>
        </div>

        <div class="amount-container expense-color" role="region" aria-label="Expense total">
          <p class="label">Expense</p>
          <p class="amount" id="expenseTotalAmount">$0.00</p>
        </div>
      </section>

      <!-- ADD NEW TRANSACTION -->
      <form class="add-transaction center-column" id="addNewTransactionForm">
        <h2 class="title">Add new transaction</h2>

        <label class="input-label" for="descriptiveText">
          <span>Descriptive Text</span>
          <input
            type="text"
            class="form-input"
            id="descriptiveText"
            name="description"
            placeholder="Enter a descriptive text..."
            required
            maxlength="120"
          />
        </label>

        <label class="input-label" for="amountText">
          <span>Amount (negative - expense | positive - income)</span>
          <input
            type="number"
            step="0.01"
            class="form-input"
            id="amountText"
            name="amount"
            placeholder="Enter the amount..."
            required
          />
        </label>

        <button type="submit" class="send-btn" id="btnAddTransaction">
          Add transaction
        </button>
      </form>

      <!-- HISTORY LIST -->
      <section class="history-container center-column" id="historyListContainer" aria-labelledby="historyTitle">
        <div class="history-row-title">
          <h2 class="title" id="historyTitle">History</h2>

          <button type="button" class="arrow-btn" aria-expanded="true" aria-controls="historyListContainer">
            <img src="./arrow-down.svg" alt="Toggle history" />
          </button>
        </div>

        <!-- transaction cards are rendered here -->
      </section>
    </main>

    <footer class="site-footer center-column">
      <p>Made with ♥ — Simple, accessible expense tracker.</p>
    </footer>

    <script src="./main.js" type="module"></script>
  </body>
</html>
